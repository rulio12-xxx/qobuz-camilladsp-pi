<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 260 95" width="1560" height="570" font-family="sans-serif" font-size="3.2">
  <rect x="-15" y="-25" width="260" height="95" fill="#fff"/>
  <!-- plaque 230 x 40, ep 2 -->
