title: Qobuz - correction par convolution (FIR kick, 22/11/2026)
description: 'FIR vers la cible (grave fort) ; lampes AVANT le FIR (23/11 : le grave du FIR faisait pomper l aigu), crete totale -6 dBFS. Bouton Kick : FIR kick / sans kick. Avant : *.avant-fir-2026-11-22,
  *.avant-lampes-avant-fir-2026-11-23'
devices:
  samplerate: 44100
  chunksize: 2048
  queuelimit: 4
  silence_threshold: -80
  silence_timeout: 200
  enable_rate_adjust: true
  capture_samplerate: 44100
  resampler:
    type: AsyncSinc
    profile: Balanced
  capture:
    type: Alsa
    channels: 2
    device: hw:10,1
    format: F32_LE
  playback:
    type: Alsa
    channels: 2
    device: hw:CARD=II,DEV=0
    format: S32_LE
filters:
  delay_L:
    type: Delay
    parameters:
      delay: 1.2
      unit: ms
      subsample: true
  delay_R:
    type: Delay
    parameters:
      delay: 0
      unit: ms
      subsample: true
  limiter:
    type: Limiter
    parameters:
      clip_limit: -0.5
      soft_clip: true
  loud_bass:
    type: Biquad
    parameters:
      type: Peaking
      freq: 80
      gain: 0.0
      q: 4.0
  loud_treble:
    type: Biquad
    parameters:
      type: Peaking
      freq: 3500
      gain: 0.0
      q: 1.2
  fir_L:
    type: Conv
    description: 'correction par convolution vers la cible (22/11/2026) ; bouton Kick : fir_*_kick.raw (avec) / fir_*_sanskick.raw (sans)'
    parameters:
      type: Raw
      filename: /home/rulio12/camilladsp/fir/fir_L_kick.raw
      format: F32_LE
  fir_R:
    type: Conv
    description: 'correction par convolution vers la cible (22/11/2026) ; bouton Kick : fir_*_kick.raw (avec) / fir_*_sanskick.raw (sans)'
    parameters:
      type: Raw
      filename: /home/rulio12/camilladsp/fir/fir_R_kick.raw
      format: F32_LE
  preamp:
    type: Gain
    description: 'niveau avant les lampes (23/11/2026) : le compresseur voit la musique sans le grave du FIR'
    parameters:
      gain: -20.5
processors:
  tube:
    type: Compressor
    parameters:
      channels: 2
      attack: 0.005
      release: 0.05
      threshold: -22
      factor: 3.0
      makeup_gain: 2.0
      clip_limit: -0.3
      soft_clip: true
pipeline:
  - type: Filter
    channels: [0]
    names:
      - delay_L
      - loud_bass
      - loud_treble
      - preamp
  - type: Filter
    channels: [1]
    names:
      - delay_R
      - loud_bass
      - loud_treble
      - preamp
  - type: Processor
    name: tube
  - type: Filter
    channels: [0]
    names:
      - fir_L
  - type: Filter
    channels: [1]
    names:
      - fir_R
  - type: Filter
    channels: [0, 1]
    names:
      - limiter
