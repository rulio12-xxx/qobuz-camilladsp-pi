mqtt:
  host: mosquitto
  user: "{FRIGATE_MQTT_USER}"
  password: "{FRIGATE_MQTT_PASSWORD}"
  topic_prefix: frigate

# CPU par defaut (suffisant pour 3 cameras sur le sous-flux).
# Avec Coral : type: edgetpu / device: usb
detectors:
  cpu1:
    type: cpu
    num_threads: 3

# Flux principal enregistre tel quel (aucun reencodage), sous-flux pour detecter.
ffmpeg:
  hwaccel_args: preset-rpi-64-h264   # Raspberry Pi 5 : retirer/adapter sur mini-PC (preset-vaapi)

detect:
  width: 640
  height: 480
  fps: 5

objects:
  track: [person, car, dog, cat]

record:
  enabled: true
  retain:
    days: 7
    mode: all
  alerts:
    retain: {days: 30}
  detections:
    retain: {days: 30}

snapshots:
  enabled: true
  retain: {default: 30}

# Reolink : h264Preview_01_main (plein) / h264Preview_01_sub (sous-flux)
go2rtc:
  streams:
    cam1_main: rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@{CAM1_IP}:554/h264Preview_01_main
    cam1_sub:  rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@{CAM1_IP}:554/h264Preview_01_sub
    cam2_main: rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@{CAM2_IP}:554/h264Preview_01_main
    cam2_sub:  rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@{CAM2_IP}:554/h264Preview_01_sub
    cam3_main: rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@{CAM3_IP}:554/h264Preview_01_main
    cam3_sub:  rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@{CAM3_IP}:554/h264Preview_01_sub

cameras:
  camera1:
    ffmpeg:
      inputs:
        - {path: "rtsp://127.0.0.1:8554/cam1_main", input_args: preset-rtsp-restream, roles: [record]}
        - {path: "rtsp://127.0.0.1:8554/cam1_sub",  input_args: preset-rtsp-restream, roles: [detect]}
  camera2:
    ffmpeg:
      inputs:
        - {path: "rtsp://127.0.0.1:8554/cam2_main", input_args: preset-rtsp-restream, roles: [record]}
        - {path: "rtsp://127.0.0.1:8554/cam2_sub",  input_args: preset-rtsp-restream, roles: [detect]}
  camera3:
    ffmpeg:
      inputs:
        - {path: "rtsp://127.0.0.1:8554/cam3_main", input_args: preset-rtsp-restream, roles: [record]}
        - {path: "rtsp://127.0.0.1:8554/cam3_sub",  input_args: preset-rtsp-restream, roles: [detect]}
